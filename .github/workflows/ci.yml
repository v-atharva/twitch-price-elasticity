name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: make lint
      - run: make typecheck
      - run: make test
      - name: synthetic pipeline end-to-end
        run: make all
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-figures
          path: outputs/figures/

  # R `did` is the reference implementation of Callaway & Sant'Anna (2021);
  # this job asserts the Python estimator matches it on the synthetic panel.
  r-crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3"
          use-public-rspm: true
      - run: Rscript -e 'install.packages("did")'
      - run: make synth
      - run: uv run python -m src.estimate.r_crosscheck
